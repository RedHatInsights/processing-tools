# Manual one-shot AGENTS.md stub sync (workflow: Bootstrap AGENTS.md / workflow_dispatch).
# Not part of continuous .github/sync.yml.
#
# Same fleet as .github/sync.yml. replace: false skips repos that already have AGENTS.md.

RedHatInsights/ccx-notification-service:
  - source: agents_bootstrap/AGENTS.md.tmpl
    dest: AGENTS.md
    replace: false
    template:
      repo_name: ccx-notification-service
      pages_url: https://redhatinsights.github.io/ccx-notification-service/
      architecture_path: ./docs/architecture.md

