# Manual one-shot AGENTS.md stub sync (workflow: Bootstrap AGENTS.md / workflow_dispatch).
# Not part of continuous .github/sync.yml.
#
# Inventory = same fleet as .github/sync.yml. Active entries get the stub; commented
# entries already have their own AGENTS.md (tracked here so nothing is forgotten).

# RedHatInsights/ccx-notification-service:  # has AGENTS.md

RedHatInsights/ccx-notification-writer:
  - source: agents_bootstrap/AGENTS.md.tmpl
    dest: AGENTS.md
    template:
      repo_name: ccx-notification-writer
      pages_url: https://redhatinsights.github.io/ccx-notification-writer/
      architecture_path: ./docs/architecture.md

